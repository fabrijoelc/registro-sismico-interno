spring.application.name=sismos
server.port=${SERVER_PORT:18084}
server.servlet.context-path=/sismos-pa3
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=never
server.error.include-stacktrace=never
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:13309/sismos_pa3?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=America/Lima&characterEncoding=UTF-8}
spring.datasource.username=${DB_USER:sismos}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Lima
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.sql.init.encoding=UTF-8
spring.thymeleaf.encoding=UTF-8
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
logging.level.org.hibernate.SQL=warn
